# End-to-end test: builds the image locally, joins the runner to the tailnet,
# and verifies that a request through the proxy reaches the test server on the
# runner.
#
# Prerequisites (repo-level setup, invisible to forks):
#   - Repository secrets TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET from a
#     Tailscale OAuth client allowed to create auth keys.
#   - MagicDNS must be enabled on the tailnet: the proxy container resolves
#     the runner's MagicDNS hostname to reach the test server.
#   - ACLs must allow devices tagged tag:testing to connect.
#   - Fork pull requests cannot read repository secrets, so they fail at the
#     "Check secrets are set" step by design.
#
# The "Build and Push Docker Image" workflow is triggered by this workflow's
# completion and publishes only when this run succeeded for the same commit.

name: Integration Test

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          missing=0
          if [ -z "${TS_OAUTH_CLIENT_ID:-}" ]; then
            echo "::error::TS_OAUTH_CLIENT_ID is not set"
            missing=1
          else
            echo "TS_OAUTH_CLIENT_ID is set"
          fi
          if [ -z "${TS_OAUTH_SECRET:-}" ]; then
            echo "::error::TS_OAUTH_SECRET is not set"
            missing=1
          else
            echo "TS_OAUTH_SECRET is set"
          fi
          # Fork PRs have no access to repository secrets, so they fail here
          # by design (see the prerequisites note at the top of this file)
          exit "$missing"

      - uses: actions/checkout@v4


      # Build a local single-platform image for testing; avoids registry dependency
      # so this job runs on both PRs and master pushes
      - name: Build test image
        run: docker build -t proxy-test-image .

      # Connect this CI runner to the tailnet so it becomes a reachable tailnet node
      - name: Connect runner to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:testing

      - name: Generate ephemeral auth key for container
        id: tskey
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
        run: |
          set -euo pipefail

          # Exchange OAuth credentials for an access token. Basic auth
          # avoids the secret appearing in the workflow log (it is still a
          # curl argv element, but the runner is ephemeral and GitHub masks
          # it; Tailscale's token endpoint accepts RFC 6749
          # client-credentials Basic auth). The response body is printed
          # only when the request fails, so a successful token is never
          # logged.
          HTTP_CODE=$(curl -sS --retry 3 --request POST \
            --url https://api.tailscale.com/api/v2/oauth/token \
            --user "$TS_OAUTH_CLIENT_ID:$TS_OAUTH_SECRET" \
            --output /tmp/ts-token.json \
            --write-out '%{http_code}') || {
              echo "::error::Could not reach the Tailscale OAuth token endpoint"
              exit 1
            }
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Tailscale OAuth token request failed with HTTP $HTTP_CODE; response body:"
            cat /tmp/ts-token.json
            exit 1
          fi
          TOKEN=$(jq -r '.access_token' /tmp/ts-token.json)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Tailscale OAuth token response contained no access_token"
            exit 1
          fi
          rm -f /tmp/ts-token.json
          echo "::add-mask::$TOKEN"
          echo "OAuth access token acquired"

          # Now use that token to create the auth key
          HTTP_CODE=$(curl -sS --retry 3 --request POST \
            --url https://api.tailscale.com/api/v2/tailnet/-/keys \
            --header "Authorization: Bearer $TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "capabilities": {
                "devices": {
                  "create": {
                    "reusable": false,
                    "ephemeral": true,
                    "preauthorized": true,
                    "tags": ["tag:testing"]
                  }
                }
              },
              "expirySeconds": 300
            }' \
            --output /tmp/ts-key.json \
            --write-out '%{http_code}') || {
              echo "::error::Could not reach the Tailscale keys API"
              exit 1
            }
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Auth key generation failed with HTTP $HTTP_CODE; response body:"
            cat /tmp/ts-key.json
            exit 1
          fi

          KEY=$(jq -r '.key' /tmp/ts-key.json)
          rm -f /tmp/ts-key.json
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error::Auth key response contained no key"
            exit 1
          fi

          echo "::add-mask::$KEY"
          echo "key=$KEY" >> $GITHUB_OUTPUT

      # Start a minimal HTTP server on the runner; it listens on 0.0.0.0 so it is
      # reachable via the runner's Tailscale IP (100.x.x.x)
      - name: Start test HTTP server on runner
        run: |
          python3 -c "
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
            def do_GET(self):
              self.send_response(200)
              self.end_headers()
              self.wfile.write(b'tailscale-proxy-test-ok')
            def log_message(self, *args): pass
          http.server.HTTPServer(('', 9999), H).serve_forever()" &
          echo $! > /tmp/test-server.pid
          sleep 1
          curl -sf http://localhost:9999/ || { echo "test server failed to start"; exit 1; }

      # Resolve the runner's MagicDNS hostname so the proxy container can route to it
      - name: Get runner's tailnet hostname
        id: tailnet
        run: |
          HOSTNAME=$(tailscale status --json | jq -r '.Self.DNSName' | sed 's/\.$//')
          echo "hostname=$HOSTNAME" >> $GITHUB_OUTPUT
          echo "Runner tailnet hostname: $HOSTNAME"

      # Run the locally built image; its tailscaled joins the tailnet with an ephemeral
      # key and socat routes localhost:8080 → SOCKS5 → runner:9999 through Tailscale
      - name: Start proxy container
        run: |
          docker run -d --name proxy-test \
            -e TS_AUTHKEY=${{ steps.tskey.outputs.key }} \
            -e TS_DEST_HOST=${{ steps.tailnet.outputs.hostname }} \
            -e TS_DEST_PORT=9999 \
            -e LISTEN_PORT=8080 \
            -p 8080:8080 \
            proxy-test-image

      # Poll until the proxy responds (tailscaled auth + socat startup can take ~20s)
      - name: Wait for proxy to be ready
        run: |
          echo "Waiting for proxy to become ready (up to 90s)..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/ >/dev/null 2>&1; then
              echo "Proxy ready after $((i * 3))s"
              exit 0
            fi
            echo "  attempt $i/30..."
            sleep 3
          done
          echo "Timed out after 90s"
          docker logs proxy-test
          exit 1

      # Verify the response came from our test server, confirming the full tunnel works
      - name: Verify end-to-end connectivity
        run: |
          RESPONSE=$(curl -sf http://localhost:8080/)
          if [ "$RESPONSE" = "tailscale-proxy-test-ok" ]; then
            echo "PASS: response proxied correctly through Tailscale tunnel"
          else
            echo "FAIL: unexpected response: '$RESPONSE'"
            docker logs proxy-test
            exit 1
          fi

      - name: Show proxy logs
        if: always()
        run: docker logs proxy-test 2>/dev/null || true

      - name: Cleanup
        if: always()
        run: |
          docker stop proxy-test 2>/dev/null || true
          docker rm proxy-test 2>/dev/null || true
          kill "$(cat /tmp/test-server.pid 2>/dev/null)" 2>/dev/null || true
